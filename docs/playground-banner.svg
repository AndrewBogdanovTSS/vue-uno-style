<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title">
  <title id="title">vue-uno-style playground: resize the window and watch the styles follow each breakpoint</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .brand { font-size: 24px; font-weight: 600; fill: #ffffff; }
    .tag { font-size: 13px; font-weight: 600; letter-spacing: .08em; fill: #00dc82; }
    .title { font-size: 46px; font-weight: 700; letter-spacing: -.02em; }
    .lead { font-size: 20px; fill: #a3a3a3; }
    .cta { font-size: 19px; font-weight: 600; fill: #0a0a0a; }
    .label { font-size: 30px; font-weight: 700; }
    .caption { font-size: 15px; font-weight: 500; }
    .still { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .motion { display: none; }
      .still { display: inline; }
    }
  </style>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#16132e"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset=".5" stop-color="#00dc82"/>
      <stop offset=".5" stop-color="#4f46e5"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity=".06"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#surface)"/>
  <rect width="1280" height="360" rx="24" fill="url(#dots)"/>
  <rect x=".5" y=".5" width="1279" height="359" rx="23.5" fill="none" stroke="#262626"/>

  <rect x="64" y="56" width="28" height="28" rx="8" fill="url(#mark)"/>
  <text x="104" y="78" class="brand">vue-uno-style<tspan class="tag" dx="14">PLAYGROUND</tspan></text>

  <text x="64" y="148" class="title" fill="#ffffff">Resize the window.</text>
  <text x="64" y="202" class="title" fill="#00dc82">Watch the styles follow.</text>
  <text x="64" y="244" class="lead">Every demo runs live, rendered on the server.</text>

  <rect x="64" y="268" width="252" height="48" rx="24" fill="#00dc82"/>
  <text x="190" y="299" class="cta" text-anchor="middle">Open the playground →</text>

  <g class="motion">
    <rect x="744" y="56" width="456" height="252" rx="14" fill="#141414" stroke="#2e2e2e"><animate attributeName="width" dur="9s" repeatCount="indefinite" keyTimes="0.0000;0.1667;0.2778;0.4444;0.5556;0.7222;0.8889;1.0000" values="456;456;330;330;210;210;456;456"/></rect>
    <line x1="744" y1="96" x2="1200" y2="96" stroke="#2e2e2e"><animate attributeName="x2" dur="9s" repeatCount="indefinite" keyTimes="0.0000;0.1667;0.2778;0.4444;0.5556;0.7222;0.8889;1.0000" values="1200;1200;1074;1074;954;954;1200;1200"/></line>
    <circle cx="766" cy="76" r="5" fill="#3f3f46"/>
    <circle cx="784" cy="76" r="5" fill="#3f3f46"/>
    <circle cx="802" cy="76" r="5" fill="#3f3f46"/>
    <rect x="760" y="112" width="424" height="180" rx="10" fill="#86efac"><animate attributeName="width" dur="9s" repeatCount="indefinite" keyTimes="0.0000;0.1667;0.2778;0.4444;0.5556;0.7222;0.8889;1.0000" values="424;424;298;298;178;178;424;424"/><animate attributeName="fill" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2160;0.5000;0.7629;0.8509" values="#86efac;#4f46e5;#c7d2fe;#4f46e5;#86efac"/></rect>
    
      <g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2160;0.5000;0.7629;0.8509" values="0;0;1;0;0"/>
        <text x="780" y="154" class="label" fill="#052e16">sm<animate attributeName="fill" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2160;0.5000;0.7629;0.8509" values="#052e16;#ffffff;#1e1b4b;#ffffff;#052e16"/></text>
        <text x="780" y="180" class="caption" fill="#052e16">under 768px<animate attributeName="fill" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2160;0.5000;0.7629;0.8509" values="#052e16;#ffffff;#1e1b4b;#ffffff;#052e16"/></text>
      </g>
      <g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2160;0.5000;0.7629;0.8509" values="0;1;0;1;0"/>
        <text x="780" y="154" class="label" fill="#052e16">md<animate attributeName="fill" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2160;0.5000;0.7629;0.8509" values="#052e16;#ffffff;#1e1b4b;#ffffff;#052e16"/></text>
        <text x="780" y="180" class="caption" fill="#052e16">768px and up<animate attributeName="fill" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2160;0.5000;0.7629;0.8509" values="#052e16;#ffffff;#1e1b4b;#ffffff;#052e16"/></text>
      </g>
      <g opacity="1"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2160;0.5000;0.7629;0.8509" values="1;0;0;0;1"/>
        <text x="780" y="154" class="label" fill="#052e16">lg<animate attributeName="fill" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2160;0.5000;0.7629;0.8509" values="#052e16;#ffffff;#1e1b4b;#ffffff;#052e16"/></text>
        <text x="780" y="180" class="caption" fill="#052e16">1024px and up<animate attributeName="fill" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2160;0.5000;0.7629;0.8509" values="#052e16;#ffffff;#1e1b4b;#ffffff;#052e16"/></text>
      </g>
    <rect x="780" y="204" width="384" height="10" rx="5" fill="#052e16" opacity=".35"><animate attributeName="width" dur="9s" repeatCount="indefinite" keyTimes="0.0000;0.1667;0.2778;0.4444;0.5556;0.7222;0.8889;1.0000" values="384;384;258;258;138;138;384;384"/><animate attributeName="fill" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2160;0.5000;0.7629;0.8509" values="#052e16;#ffffff;#1e1b4b;#ffffff;#052e16"/></rect>
    <rect x="780" y="224" width="230" height="10" rx="5" fill="#052e16" opacity=".35"><animate attributeName="width" dur="9s" repeatCount="indefinite" keyTimes="0.0000;0.1667;0.2778;0.4444;0.5556;0.7222;0.8889;1.0000" values="230;230;155;155;83;83;230;230"/><animate attributeName="fill" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2160;0.5000;0.7629;0.8509" values="#052e16;#ffffff;#1e1b4b;#ffffff;#052e16"/></rect>
    <rect x="780" y="252" width="84" height="22" rx="11" fill="#052e16" opacity=".85"><animate attributeName="fill" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2160;0.5000;0.7629;0.8509" values="#052e16;#ffffff;#1e1b4b;#ffffff;#052e16"/></rect>
    <g transform="translate(456 0)"><animateTransform attributeName="transform" type="translate" dur="9s" repeatCount="indefinite" keyTimes="0.0000;0.1667;0.2778;0.4444;0.5556;0.7222;0.8889;1.0000" values="456 0;456 0;330 0;330 0;210 0;210 0;456 0;456 0"/>
      <rect x="741" y="158" width="6" height="56" rx="3" fill="#00dc82"/>
      <path d="M756 186h22M756 186l6 -6M756 186l6 6M778 186l-6 -6M778 186l-6 6" stroke="#00dc82" stroke-width="3" stroke-linecap="round" fill="none"/>
    </g>
  </g>
  <g class="still">
    <rect x="744" y="56" width="456" height="252" rx="14" fill="#141414" stroke="#2e2e2e"></rect>
    <line x1="744" y1="96" x2="1200" y2="96" stroke="#2e2e2e"></line>
    <circle cx="766" cy="76" r="5" fill="#3f3f46"/>
    <circle cx="784" cy="76" r="5" fill="#3f3f46"/>
    <circle cx="802" cy="76" r="5" fill="#3f3f46"/>
    <rect x="760" y="112" width="424" height="180" rx="10" fill="#86efac"></rect>
    
      <g opacity="0">
        <text x="780" y="154" class="label" fill="#052e16">sm</text>
        <text x="780" y="180" class="caption" fill="#052e16">under 768px</text>
      </g>
      <g opacity="0">
        <text x="780" y="154" class="label" fill="#052e16">md</text>
        <text x="780" y="180" class="caption" fill="#052e16">768px and up</text>
      </g>
      <g opacity="1">
        <text x="780" y="154" class="label" fill="#052e16">lg</text>
        <text x="780" y="180" class="caption" fill="#052e16">1024px and up</text>
      </g>
    <rect x="780" y="204" width="384" height="10" rx="5" fill="#052e16" opacity=".35"></rect>
    <rect x="780" y="224" width="230" height="10" rx="5" fill="#052e16" opacity=".35"></rect>
    <rect x="780" y="252" width="84" height="22" rx="11" fill="#052e16" opacity=".85"></rect>
    <g transform="translate(456 0)">
      <rect x="741" y="158" width="6" height="56" rx="3" fill="#00dc82"/>
      <path d="M756 186h22M756 186l6 -6M756 186l6 6M778 186l-6 -6M778 186l-6 6" stroke="#00dc82" stroke-width="3" stroke-linecap="round" fill="none"/>
    </g>
  </g>
</svg>
