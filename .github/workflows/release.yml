name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:unit
      - run: pnpm smoke
      - run: pnpm check:docs
      - run: pnpm playground:install
      - run: pnpm playground:verify

      - name: The tag matches package.json
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$packaged" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $packaged"
            exit 1
          fi

      # Trusted publishing: npm exchanges the job's OIDC token for a
      # short-lived publish token, so no NPM_TOKEN secret exists.
      # It needs npm >= 11.5.1. Node 26 bundles npm 11.20.0, which meets
      # that; the upgrade keeps the floor if the Node version changes.
      - run: npm install -g npm@latest
      - run: npm publish --access public

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
