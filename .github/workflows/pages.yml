name: pages

# Builds the playground as a static site and publishes it to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a running one finishes before the next starts.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Pages serves a project site at /<repository>/.
      NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
      NITRO_PRESET: github_pages
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm playground:install
      - run: pnpm playground:generate
      # Checks the deployed output under the same base path, so a broken base never ships.
      - run: pnpm --dir playground verify:ssr
      - uses: actions/upload-pages-artifact@v5
        with:
          path: playground/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
